[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletters"
version = "0.1.0"
description = "Gemini Deep Research-first weekly SEO, GEO and AI visibility intelligence pipeline"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.20,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
visiwing-intel = "intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["intelligence*"]
